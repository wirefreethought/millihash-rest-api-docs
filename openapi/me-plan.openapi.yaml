openapi: 3.0.3
info:
  title: MilliHash Plan API
  version: 1.0.0
  description: Current subscription plan and size ceilings for the authenticated caller.
paths:
  /me/plan:
    get:
      operationId: getMePlan
      summary: Get current plan limits
      description: |
        Returns the caller's subscription plan and byte ceilings for asset upload
        and similarity query text.
      tags:
        - Plan
      security:
        - RapidApiKey: []
      responses:
        "200":
          description: Plan and limits for the authenticated caller
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/MePlan'
              example:
                plan: BASIC
                maxAssetUploadSize: 10485760
                maxSimilarityQuerySize: 65536
                nextPlan: PRO
        "401":
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
components:
  schemas:
    MePlan:
      type: object
      additionalProperties: false
      required:
        - plan
        - maxAssetUploadSize
        - maxSimilarityQuerySize
        - nextPlan
      properties:
        plan:
          type: string
          enum: [BASIC, PRO, ULTRA, MEGA]
          description: Current plan tier
        maxAssetUploadSize:
          type: integer
          format: int64
          minimum: 1
          description: Max server-computed asset size in bytes (file or UTF-8 text)
        maxSimilarityQuerySize:
          type: integer
          format: int64
          minimum: 1
          description: Max similarity search query size in UTF-8 bytes (after normalization)
        nextPlan:
          nullable: true
          description: Next upgrade tier, or null on MEGA
          oneOf:
            - type: string
              enum: [PRO, ULTRA, MEGA]
            - type: 'null'
