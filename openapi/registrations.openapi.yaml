openapi: 3.1.0
info:
  title: MilliHash Registration API
  version: 1.1.0
  description: |
    FR1 — Register an Asset. Authenticated RapidAPI ingress only.
    Error envelope shape published by api-platform (002-api-platform).

    Multi-digest + labels: create returns typed `digests[]` and label fields.
    Mutable `labelPublic` / `internalLabel` after create are owned by owner-portfolio
    via PATCH /registrations/{registrationId} (owner-portfolio OpenAPI) — not FR1 POST.
servers:
  - url: https://api.millihash.com
    description: Production API (RapidAPI authenticated ingress for FR1)
paths:
  /registrations:
    post:
      operationId: createRegistration
      summary: Register an asset hash with RFC 3161 TSA timestamp
      description: |
        Synchronous registration pipeline: resolve typed proof digests (or accept client-supplied
        hash as client-supplied-v1), compute VersionCommitment (`contentHash`), acquire TSA token
        over that commitment, enforce per-registrant uniqueness per proof digest (the same registrant re-registering a proof digest is
        rejected; a different registrant succeeds with a prior-registration notice), persist Registration,
        enqueue AnchorJob. Asset bytes are never stored. Client-supplied mode accepts hash hex
        only (no file upload). Optional immutable `label`; optional `labelPublic` (default false);
        optional `internalLabel` (owner-only).
      tags:
        - Registrations
      security:
        - RapidApiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServerComputedMultipartRequest'
          application/vnd.millihash.v1+json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ServerComputedJsonRequest'
                - $ref: '#/components/schemas/ClientSuppliedJsonRequest'
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ServerComputedJsonRequest'
                - $ref: '#/components/schemas/ClientSuppliedJsonRequest'
      responses:
        '201':
          description: |
            Registration created. When other registrants already registered one or more of the same proof
            digests, `priorRegistrationNotice` is included (earliest prior TSA timestamp + later match count;
            never who registered them).
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/RegistrationCreatedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCreatedResponse'
        '400':
          description: Validation error (hash format, label size, client-supplied file upload, missing/invalid registrantRole → REGISTRANT_ROLE_REQUIRED)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Duplicate proof digest by the same registrant (DUPLICATE_HASH sequential, DUPLICATE_HASH_RACE concurrent)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/DuplicateRegistrationResponse'
        '413':
          description: Asset or text exceeds plan limits
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: All TSA providers exhausted
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /registrations/{registrationId}/fingerprint-refreshes:
    post:
      operationId: createFingerprintRefresh
      summary: Refresh discovery fingerprints for a registration (FR20)
      description: |
        Registrant-only (authenticated `OwnerKey` must equal the registration's owner, else 403
        `NOT_REGISTRATION_OWNER`). Re-upload the original file or text. Succeeds when **any** recomputed proof
        digest hex overlaps **any** stored proof digest hex (text: `literal-v1`, `text-normalized-v2`,
        `text-normalized-v1`; binary: `bytes-raw-v1`); client-supplied registrations are allowed when the hex
        overlaps the stored `client-supplied-v1` proof. No overlap → 409 `PROOF_HASH_MISMATCH`.

        Discovery-only: proof digests, VersionCommitment (`contentHash`) and the original TSA token are never
        mutated. On success a `FingerprintRefresh` (`linkKind=fingerprint_refresh`) with its own TSA token and
        AnchorJob is created (tip digests = this attempt only); the registration's `fingerprintSetVersion` is
        advanced; parent `role=discovery` digests are **union-merged by algorithm id** (overwrite successes;
        retain prior for failed/omitted producers). Already-current `fingerprintSetVersion` does not block.
        Pure-text V1 may commit an empty discovery tip. Partial producer success may commit under the union
        rule; zero entitled producers → 403 `FINGERPRINT_NOT_ENTITLED`; all entitled producers fail → 503
        `FINGERPRINT_PRODUCERS_FAILED` (nothing committed). TSA exhaustion → 502 `TSA_PROVIDERS_EXHAUSTED`
        (no row, no version bump, no discovery merge). Concurrent refreshes: exactly one 201, others 409
        `FINGERPRINT_REFRESH_RACE`. A client disconnect before the response is emitted rolls everything back
        (including undoing discovery merge). Async audit `fingerprint.refresh` on success. A refresh does
        **not** consume monthly registration quota (FR20-006).
      tags:
        - Registrations
      security:
        - RapidApiKey: []
      parameters:
        - name: registrationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FingerprintRefreshMultipartRequest'
      responses:
        '201':
          description: Fingerprint refresh committed
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/FingerprintRefreshCreatedResponse'
        '400':
          description: No / conflicting content (file and text both, or neither) or non-multipart request (HASH_FORMAT_INVALID)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required (AUTH_REQUIRED)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: |
            `NOT_REGISTRATION_OWNER` (caller is not the registrant) or `FINGERPRINT_NOT_ENTITLED` (zero entitled
            discovery producers for plan + media type — plan-upgrade signal)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Registration not found (REGISTRATION_NOT_FOUND)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `PROOF_HASH_MISMATCH` (no proof digest overlap) or `FINGERPRINT_REFRESH_RACE` (concurrent refresh lost;
            body includes `winnerFingerprintRefreshId` when the winner is already durable)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: All TSA providers exhausted (TSA_PROVIDERS_EXHAUSTED); no refresh, no version bump
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Every entitled fingerprint producer failed (FINGERPRINT_PRODUCERS_FAILED); nothing committed
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    RapidApiKey:
      type: apiKey
      in: header
      name: X-RapidAPI-Key
      description: Validated at RapidAPI gateway; backend trusts injected identity headers
  schemas:
    ErrorEnvelope:
      $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
    ContentDigest:
      type: object
      required: [role, algorithm, transform, digestHex]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [proof, discovery]
          description: |
            `proof` digests are claimed, committed (VersionCommitment) and FR2-verifiable. `discovery`
            digests (FR22 media similarity candidates) are never claimed, never committed and never proof.
        algorithm:
          type: string
          description: |
            Proof: `sha256`. Discovery (FR22): `pdq`, `pdq-rot90|rot180|rot270|flipx|flipy|flipplus90|flipminus90`,
            `imagehash-phash`, `vpdq`, `chromaprint`. Production producers use native PDQ / imagehash-pHash
            (`pdq-v1` / `imagehash-phash-v1`); vPDQ / Chromaprint use platform tools when available
            (`vpdq-v1` / `chromaprint-v1`) and fail-open otherwise.
        transform:
          type: string
          description: |
            Versioned transform id — V1 proof producers:
            bytes-raw-v1 | literal-v1 | text-normalized-v2 | client-supplied-v1
        digestHex:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ServerComputedMultipartRequest:
      type: object
      required:
        - submissionMode
        - registrantRole
      properties:
        submissionMode:
          type: string
          enum: [server-computed]
        registrantRole:
          type: string
          enum: [creator, witness]
          description: |
            Required self-declared relationship to the asset (FR1-003). Never verified; immutable
            after create; not part of the VersionCommitment. Omitted/blank/unknown → 400 REGISTRANT_ROLE_REQUIRED.
        label:
          type: string
          maxLength: 200
          description: Immutable after create; omit/blank → permanent empty
        labelPublic:
          type: boolean
          default: false
          description: Forced false when label empty; mutable later via PATCH (FR3)
        internalLabel:
          type: string
          description: Owner-only private name; never on certificates or public APIs
        mediaType:
          type: string
          description: Informational MIME hint
        contentType:
          type: string
          enum: [binary, text]
          default: binary
        text:
          type: string
          description: Required when contentType=text (alternative to file part)
        file:
          type: string
          format: binary
          description: Raw bytes for binary server-computed mode
        similarityOptIn:
          type: boolean
          default: false
          description: |
            FR21: opt into similarity indexing. Text-only; binary or client-supplied with true → 400 SIMILARITY_TEXT_ONLY.
        discoverability:
          type: string
          enum: [hidden, label_visible]
          default: hidden
          description: "FR21: how the registration appears in similarity results when opted in"
    ServerComputedJsonRequest:
      type: object
      required:
        - submissionMode
        - registrantRole
        - contentType
      properties:
        submissionMode:
          type: string
          enum: [server-computed]
        registrantRole:
          type: string
          enum: [creator, witness]
          description: |
            Required self-declared relationship to the asset (FR1-003). Never verified; immutable
            after create; not part of the VersionCommitment. Omitted/blank/unknown → 400 REGISTRANT_ROLE_REQUIRED.
        contentType:
          type: string
          enum: [text]
        text:
          type: string
        label:
          type: string
        labelPublic:
          type: boolean
          default: false
        internalLabel:
          type: string
        similarityOptIn:
          type: boolean
          default: false
          description: |
            FR21: opt into similarity indexing (text JSON only). Binary/client-supplied → 400 SIMILARITY_TEXT_ONLY.
        discoverability:
          type: string
          enum: [hidden, label_visible]
          default: hidden
    ClientSuppliedJsonRequest:
      type: object
      required:
        - submissionMode
        - registrantRole
        - hash
      properties:
        submissionMode:
          type: string
          enum: [client-supplied]
        registrantRole:
          type: string
          enum: [creator, witness]
          description: |
            Required self-declared relationship to the asset (FR1-003). Never verified; immutable
            after create; not part of the VersionCommitment. Omitted/blank/unknown → 400 REGISTRANT_ROLE_REQUIRED.
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        mediaType:
          type: string
        label:
          type: string
        labelPublic:
          type: boolean
          default: false
        internalLabel:
          type: string

    RegistrationCreatedResponse:
      type: object
      required:
        - registrationId
        - hash
        - digests
        - submissionMode
        - registrantRole
        - label
        - labelPublic
        - tsaTimestamp
        - tsaProvider
        - certificateUrl
        - keepOriginalsNotice
      additionalProperties: false
      properties:
        registrationId:
          type: string
          format: uuid
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Designated primary proof digest (compat)
        digests:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContentDigest'
        fingerprintSetVersion:
          type: string
          description: |
            FR22. Full entitled discovery-fingerprint attempt set for the asset's media type and the
            caller's plan (e.g. `fsv1:image:imagehash-phash@imagehash-phash-v1,pdq@pdq-v1`). Present only when
            at least one producer was entitled; a partial producer failure does not narrow it.
            Images: all plans; video + audio: PRO+.
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: VersionCommitment hex (standalone); computed over proof digests only
        submissionMode:
          type: string
          enum: [server-computed, client-supplied]
        registrantRole:
          type: string
          enum: [creator, witness]
        label:
          type: string
        labelPublic:
          type: boolean
        internalLabel:
          type: string
          nullable: true
          description: Owner-only; present on authenticated create response
        discoverability:
          type: string
          enum: [hidden, label_visible]
          description: "FR21: present when opted into similarity"
        similarityIndexStatus:
          type: string
          enum: [pending, indexed, failed]
          description: "FR21: `pending` on opt-in 201; omitted when not opted in"
        tsaTimestamp:
          type: string
          format: date-time
          description: UTC ISO-8601 with millisecond precision from TSA token
        tsaProvider:
          type: string
        certificateUrl:
          type: string
          format: uri-reference
        keepOriginalsNotice:
          type: string
          minLength: 1
          description: |
            FR1-017 / FR20-008. Required non-empty keep-originals reminder (same contract as
            FingerprintRefreshCreatedResponse.keepOriginalsNotice).
        c2pa:
          $ref: '#/components/schemas/C2paMetadata'
        priorRegistrationNotice:
          $ref: '#/components/schemas/PriorRegistrationNotice'
    PriorRegistrationNotice:
      type: object
      description: |
        FR1-020. Present only when other registrants already registered a matching proof digest.
        Never identifies the other registrants.
      required:
        - earliestPriorTsaTimestamp
        - laterMatchCount
      additionalProperties: false
      properties:
        earliestPriorTsaTimestamp:
          type: string
          format: date-time
          description: Earliest TSA timestamp among other registrants' matching registrations (UTC, millisecond precision)
        laterMatchCount:
          type: integer
          minimum: 0
          description: Number of other-registrant matching registrations after the earliest one
    C2paMetadata:
      type: object
      required:
        - c2paClaimGenerator
        - c2paSigningTime
        - c2paSignerDisplayName
        - c2paSignerTrusted
        - c2paHasIngredients
      additionalProperties: false
      properties:
        c2paClaimGenerator:
          type: string
        c2paSigningTime:
          type: string
          format: date-time
        c2paSignerDisplayName:
          type: string
        c2paSignerTrusted:
          type: boolean
        c2paDigitalSourceType:
          type: string
        c2paHasIngredients:
          type: boolean
        trustNotice:
          type: string
          description: |
            Literal display string per FR1-028:
            "C2PA signer verified against C2PA Trust List as of registration time" or
            "C2PA signer not found on Trust List at registration time"
    DuplicateRegistrationResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required:
            - existingRegistration
          properties:
            existingRegistration:
              $ref: '#/components/schemas/RegistrationSummary'
    RegistrationSummary:
      type: object
      required:
        - registrationId
        - hash
        - digests
        - submissionMode
        - tsaTimestamp
        - tsaProvider
        - certificateUrl
      description: |
        409 existingRegistration. Include `label` only when labelPublic=true and label
        non-empty. Never include internalLabel.
      properties:
        registrationId:
          type: string
          format: uuid
        hash:
          type: string
        digests:
          type: array
          items:
            $ref: '#/components/schemas/ContentDigest'
        submissionMode:
          type: string
        registrantSnapshot:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
        tsaTimestamp:
          type: string
          format: date-time
        tsaProvider:
          type: string
        certificateUrl:
          type: string
        label:
          type: string
          description: Present only when labelPublic=true and label non-empty
    FingerprintRefreshMultipartRequest:
      type: object
      description: Provide exactly one of `file` or `text`.
      properties:
        file:
          type: string
          format: binary
          description: Original asset bytes
        text:
          type: string
          description: Original text (trimmed like FR1 registration before hashing)
        mediaType:
          type: string
          description: Optional media type override; defaults to the registration's media type
        similarityOptIn:
          type: boolean
          default: false
          description: |
            FR21: opt an existing text Registration into similarity (pure-text only).
            Binary with true → 400 SIMILARITY_TEXT_ONLY. Proof mismatch → 409 with no enqueue.
        discoverability:
          type: string
          enum: [hidden, label_visible]
          default: hidden
    FingerprintRefreshCreatedResponse:
      type: object
      required:
        - fingerprintRefreshId
        - registrationId
        - linkKind
        - sequence
        - originalProofHash
        - digests
        - fingerprintSetVersion
        - tsaTimestamp
        - tsaProvider
        - createdAt
        - lineage
        - keepOriginalsNotice
      additionalProperties: false
      properties:
        fingerprintRefreshId:
          type: string
        registrationId:
          type: string
        linkKind:
          type: string
          enum: [fingerprint_refresh]
        sequence:
          type: integer
          minimum: 1
          description: 1-based position in the registration's refresh lineage
        originalProofHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Stored proof digest hex that overlapped the upload
        digests:
          type: array
          minItems: 0
          description: New `role=discovery` digests only (empty for pure-text catalog tip)
          items:
            $ref: '#/components/schemas/ContentDigest'
        fingerprintSetVersion:
          type: string
          description: Producer set applied by this refresh (now also the registration's `fingerprintSetVersion`)
        previousFingerprintSetVersion:
          type: string
        tsaTimestamp:
          type: string
          format: date-time
          description: Refresh-owned TSA timestamp (independent of the registration's)
        tsaProvider:
          type: string
        createdAt:
          type: string
          format: date-time
        lineage:
          $ref: '#/components/schemas/FingerprintLineage'
        keepOriginalsNotice:
          type: string
          description: FR20-008 reminder to keep original files
        discoverability:
          type: string
          enum: [hidden, label_visible]
          description: "FR21: echoed from the parent when opted into similarity"
        similarityIndexStatus:
          type: string
          enum: [pending, indexed, failed]
          description: "FR21: pending on opt-in / failed retry"
    FingerprintLineage:
      type: object
      description: |
        FR20-007 refresh lineage + outdated badge fields. Portfolio / My Registry (006) consumes the same shape
        (T200 handoff).
      required: [refreshCount, outdated]
      additionalProperties: false
      properties:
        fingerprintSetVersion:
          type: string
        refreshCount:
          type: integer
          minimum: 0
        latestFingerprintRefreshId:
          type: string
        latestRefreshedAt:
          type: string
          format: date-time
        outdated:
          type: boolean
          description: True when the caller's plan currently entitles a newer/different producer set for this media type
