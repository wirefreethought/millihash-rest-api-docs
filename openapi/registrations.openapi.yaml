openapi: 3.1.0
info:
  title: MilliHash Registration API
  version: 1.1.0
  description: |
    FR1 — Register an Asset. Authenticated RapidAPI ingress only.
    Error envelope shape published by api-platform (002-api-platform).

    Multi-digest + labels: create returns typed `digests[]` and label fields.
    Mutable `labelPublic` / `internalLabel` after create are owned by owner-portfolio
    via PATCH /registrations/{registrationId} (owner-portfolio OpenAPI) — not FR1 POST.
servers:
  - url: https://api.millihash.com
    description: Production API (RapidAPI authenticated ingress for FR1)
paths:
  /registrations:
    post:
      operationId: createRegistration
      summary: Register an asset hash with RFC 3161 TSA timestamp
      description: |
        Synchronous registration pipeline: resolve typed proof digests (or accept client-supplied
        hash as client-supplied-v1), compute VersionCommitment (`contentHash`), acquire TSA token
        over that commitment, enforce global uniqueness per proof digest, persist Registration,
        enqueue AnchorJob. Asset bytes are never stored. Client-supplied mode accepts hash hex
        only (no file upload). Optional immutable `label`; optional `labelPublic` (default false);
        optional `internalLabel` (owner-only).
      tags:
        - Registrations
      security:
        - RapidApiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServerComputedMultipartRequest'
          application/vnd.millihash.v1+json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ServerComputedJsonRequest'
                - $ref: '#/components/schemas/ClientSuppliedJsonRequest'
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ServerComputedJsonRequest'
                - $ref: '#/components/schemas/ClientSuppliedJsonRequest'
      responses:
        '201':
          description: Registration created
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/RegistrationCreatedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCreatedResponse'
        '400':
          description: Validation error (hash format, label size, client-supplied file upload)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Duplicate proof digest (sequential or concurrent race)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/DuplicateRegistrationResponse'
        '413':
          description: Asset or text exceeds plan limits
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: All TSA providers exhausted
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    RapidApiKey:
      $ref: 'common.openapi.yaml#/components/securitySchemes/RapidApiKey'
  schemas:
    ErrorEnvelope:
      $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
    ContentDigest:
      type: object
      required: [role, algorithm, transform, digestHex]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [proof, discovery]
          description: V1 create responses include role=proof only
        algorithm:
          type: string
          enum: [sha256]
        transform:
          type: string
          description: |
            Versioned transform id — V1 proof producers:
            bytes-raw-v1 | literal-v1 | text-normalized-v2 | client-supplied-v1
        digestHex:
          type: string
          pattern: '^[0-9a-f]{64}$'
    ServerComputedMultipartRequest:
      type: object
      required:
        - submissionMode
      properties:
        submissionMode:
          type: string
          enum: [server-computed]
        label:
          type: string
          maxLength: 200
          description: Immutable after create; omit/blank → permanent empty
        labelPublic:
          type: boolean
          default: false
          description: Forced false when label empty; mutable later via PATCH (FR3)
        internalLabel:
          type: string
          description: Owner-only private name; never on certificates or public APIs
        mediaType:
          type: string
          description: Informational MIME hint
        contentType:
          type: string
          enum: [binary, text]
          default: binary
        text:
          type: string
          description: Required when contentType=text (alternative to file part)
        file:
          type: string
          format: binary
          description: Raw bytes for binary server-computed mode
    ServerComputedJsonRequest:
      type: object
      required:
        - submissionMode
        - contentType
      properties:
        submissionMode:
          type: string
          enum: [server-computed]
        contentType:
          type: string
          enum: [text]
        text:
          type: string
        label:
          type: string
        labelPublic:
          type: boolean
          default: false
        internalLabel:
          type: string
    ClientSuppliedJsonRequest:
      type: object
      required:
        - submissionMode
        - hash
      properties:
        submissionMode:
          type: string
          enum: [client-supplied]
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        mediaType:
          type: string
        label:
          type: string
        labelPublic:
          type: boolean
          default: false
        internalLabel:
          type: string

    RegistrationCreatedResponse:
      type: object
      required:
        - registrationId
        - hash
        - digests
        - submissionMode
        - label
        - labelPublic
        - tsaTimestamp
        - tsaProvider
        - certificateUrl
      additionalProperties: false
      properties:
        registrationId:
          type: string
          format: uuid
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Designated primary proof digest (compat)
        digests:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ContentDigest'
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: VersionCommitment hex (standalone)
        submissionMode:
          type: string
          enum: [server-computed, client-supplied]
        label:
          type: string
        labelPublic:
          type: boolean
        internalLabel:
          type: string
          nullable: true
          description: Owner-only; present on authenticated create response
        tsaTimestamp:
          type: string
          format: date-time
          description: UTC ISO-8601 with millisecond precision from TSA token
        tsaProvider:
          type: string
        certificateUrl:
          type: string
          format: uri-reference
        c2pa:
          $ref: '#/components/schemas/C2paMetadata'
    C2paMetadata:
      type: object
      required:
        - c2paClaimGenerator
        - c2paSigningTime
        - c2paSignerDisplayName
        - c2paSignerTrusted
        - c2paHasIngredients
      additionalProperties: false
      properties:
        c2paClaimGenerator:
          type: string
        c2paSigningTime:
          type: string
          format: date-time
        c2paSignerDisplayName:
          type: string
        c2paSignerTrusted:
          type: boolean
        c2paDigitalSourceType:
          type: string
        c2paHasIngredients:
          type: boolean
        trustNotice:
          type: string
          description: |
            Literal display string per FR1-028:
            "C2PA signer verified against C2PA Trust List as of registration time" or
            "C2PA signer not found on Trust List at registration time"
    DuplicateRegistrationResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required:
            - existingRegistration
          properties:
            existingRegistration:
              $ref: '#/components/schemas/RegistrationSummary'
    RegistrationSummary:
      type: object
      required:
        - registrationId
        - hash
        - digests
        - submissionMode
        - tsaTimestamp
        - tsaProvider
        - certificateUrl
      description: |
        409 existingRegistration. Include `label` only when labelPublic=true and label
        non-empty. Never include internalLabel.
      properties:
        registrationId:
          type: string
          format: uuid
        hash:
          type: string
        digests:
          type: array
          items:
            $ref: '#/components/schemas/ContentDigest'
        submissionMode:
          type: string
        registrantSnapshot:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
        tsaTimestamp:
          type: string
          format: date-time
        tsaProvider:
          type: string
        certificateUrl:
          type: string
        label:
          type: string
          description: Present only when labelPublic=true and label non-empty
