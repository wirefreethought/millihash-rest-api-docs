openapi: 3.1.0
info:
  title: MilliHash Registration API
  version: 1.1.0
  description: |
    Register assets and refresh discovery fingerprints. Create returns typed `digests[]` and labels.
    Patch label visibility / internal name via `PATCH /registrations/{registrationId}` (portfolio).
servers:
  - url: https://millihash.p.rapidapi.com
    description: Authenticated API
paths:
  /registrations:
    post:
      operationId: createRegistration
      summary: Register an asset
      description: |
        Hash the asset (or accept a client-supplied SHA-256), timestamp a version commitment with
        RFC 3161 TSA, persist the registration, and enqueue Bitcoin anchoring.

        - **JSON** — text (`text`) or client-supplied (`hash`); no body `contentType`.
        - **Multipart** — required `file` + optional `mediaType` (sniff if omitted).
        - Asset bytes are never stored — only digests and metadata.
        - Same proof digest by the same caller → 409; other callers may succeed with a prior-registration notice.
      tags:
        - Registrations
      security:
        - RapidApiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ServerComputedMultipartRequest'
          application/vnd.millihash.v1+json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ServerComputedJsonRequest'
                - $ref: '#/components/schemas/ClientSuppliedJsonRequest'
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/ServerComputedJsonRequest'
                - $ref: '#/components/schemas/ClientSuppliedJsonRequest'
      responses:
        '201':
          description: |
            Registration created. May include `priorRegistrationNotice` when other registrants
            already hold overlapping proof digests (earliest TSA + later count; never identities).
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/RegistrationCreatedResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationCreatedResponse'
        '400':
          description: Validation error (hash, media type, label size, registrantRole, …)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Duplicate proof digest for this caller (DUPLICATE_HASH / DUPLICATE_HASH_RACE)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/DuplicateRegistrationResponse'
        '413':
          description: Asset or text exceeds plan limits
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: All TSA providers exhausted
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /registrations/{registrationId}/fingerprint-refreshes:
    post:
      operationId: createFingerprintRefresh
      summary: Refresh discovery fingerprints
      description: |
        Re-upload the **original** asset for a registration you own. Proof digests, version commitment,
        and original TSA stay unchanged. On success, MilliHash adds discovery fingerprints, advances
        `fingerprintSetVersion`, and creates a separately timestamped / anchored `FingerprintRefresh`.

        - **JSON** — `{ "text": "..." }` for text registrations.
        - **Multipart** — `file` + optional `mediaType`.
        - Proof match required (any overlapping proof hex); else 409 `PROOF_HASH_MISMATCH`.
        - Does not consume registration quota.
      tags:
        - Registrations
      security:
        - RapidApiKey: []
      parameters:
        - name: registrationId
          in: path
          required: true
          description: Registration to refresh (must be yours)
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FingerprintRefreshMultipartRequest'
          application/vnd.millihash.v1+json:
            schema:
              $ref: '#/components/schemas/FingerprintRefreshJsonRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/FingerprintRefreshJsonRequest'
      responses:
        '201':
          description: Fingerprint refresh committed
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/FingerprintRefreshCreatedResponse'
        '400':
          description: Validation error (HASH_FORMAT_INVALID | MEDIA_TYPE_UNRESOLVED | MEDIA_TYPE_MISMATCH | TEXT_ENCODING_INVALID | SIMILARITY_TEXT_ONLY)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required (AUTH_REQUIRED)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: |
            `NOT_ASSET_REGISTRANT` (caller is not the registrant) or `FINGERPRINT_NOT_ENTITLED` (zero entitled
            discovery producers for plan + media type — plan-upgrade signal)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Registration not found (REGISTRATION_NOT_FOUND)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `PROOF_HASH_MISMATCH` (no proof digest overlap) or `FINGERPRINT_REFRESH_RACE` (concurrent refresh lost;
            body includes `winnerFingerprintRefreshId` when the winner is already durable)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '502':
          description: All TSA providers exhausted (TSA_PROVIDERS_EXHAUSTED); no refresh, no version bump
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Every entitled fingerprint producer failed (FINGERPRINT_PRODUCERS_FAILED); nothing committed
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  securitySchemes:
    RapidApiKey:
      $ref: 'common.openapi.yaml#/components/securitySchemes/RapidApiKey'
  schemas:
    ErrorEnvelope:
      $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
    ContentDigest:
      type: object
      required: [role, algorithm, transform, digestHex]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [proof, discovery]
          description: |
            `proof` — claimed, committed, and verifiable via `POST /verify`.
            `discovery` — media similarity fingerprints only; never claimed or proof.
        algorithm:
          type: string
          description: |
            Proof: `sha256`. Discovery: `pdq` (+ rotation/flip variants), `imagehash-phash`,
            `vpdq`, `chromaprint`.
        transform:
          type: string
          description: |
            Versioned transform id. Proof examples: `bytes-raw-v1`, `literal-v1`,
            `text-normalized-v2`, `client-supplied-v1`.
        digestHex:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex digest
    ServerComputedMultipartRequest:
      type: object
      required:
        - submissionMode
        - registrantRole
        - file
      properties:
        submissionMode:
          type: string
          enum: [server-computed]
          description: Must be `server-computed` for multipart uploads
        registrantRole:
          type: string
          enum: [creator, witness]
          description: |
            Self-declared relationship to the asset. Not verified; immutable after create.
            Omitted/blank/unknown → 400 `REGISTRANT_ROLE_REQUIRED`.
        label:
          type: string
          maxLength: 200
          description: Immutable display label; omit/blank → permanently empty
        labelPublic:
          type: boolean
          default: false
          description: Show `label` on public verify; forced false when label empty. Mutable via PATCH.
        internalLabel:
          type: string
          description: Private name; never on certificates or public APIs
        mediaType:
          type: string
          description: |
            Optional MIME. Sniffed when omitted or `application/octet-stream`.
            Unresolved → 400 `MEDIA_TYPE_UNRESOLVED`; sniff mismatch → 400 `MEDIA_TYPE_MISMATCH`.
            `text/*` file bytes must be valid UTF-8.
        file:
          type: string
          format: binary
          description: Asset bytes (prefer JSON `{ text }` for pure text)
        similarityOptIn:
          type: boolean
          default: false
          description: Opt into similarity indexing. Text-only; binary with true → 400 `SIMILARITY_TEXT_ONLY`.
        discoverability:
          type: string
          enum: [hidden, label_visible]
          default: hidden
          description: How this registration appears in similarity results when opted in
    ServerComputedJsonRequest:
      type: object
      required:
        - submissionMode
        - registrantRole
        - text
      properties:
        submissionMode:
          type: string
          enum: [server-computed]
          description: Must be `server-computed` for server-hashed text
        registrantRole:
          type: string
          enum: [creator, witness]
          description: |
            Self-declared relationship to the asset. Not verified; immutable after create.
            Omitted/blank/unknown → 400 `REGISTRANT_ROLE_REQUIRED`.
        text:
          type: string
          description: UTF-8 text asset (no body `contentType` field)
        mediaType:
          type: string
          description: Optional; must be `text/*` when present (defaults to `text/plain`)
        label:
          type: string
          maxLength: 200
          description: Immutable display label; omit/blank → permanently empty
        labelPublic:
          type: boolean
          default: false
          description: Show `label` on public verify; mutable via PATCH
        internalLabel:
          type: string
          description: Private name; never on certificates or public APIs
        similarityOptIn:
          type: boolean
          default: false
          description: Opt into similarity indexing (text only)
        discoverability:
          type: string
          enum: [hidden, label_visible]
          default: hidden
          description: How this registration appears in similarity results when opted in
    ClientSuppliedJsonRequest:
      type: object
      required:
        - submissionMode
        - registrantRole
        - hash
      properties:
        submissionMode:
          type: string
          enum: [client-supplied]
          description: Must be `client-supplied` when sending a precomputed hash
        registrantRole:
          type: string
          enum: [creator, witness]
          description: |
            Self-declared relationship to the asset. Not verified; immutable after create.
            Omitted/blank/unknown → 400 `REGISTRANT_ROLE_REQUIRED`.
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Client-computed SHA-256 hex (no file upload)
        mediaType:
          type: string
          description: Optional MIME hint for the hashed asset
        label:
          type: string
          maxLength: 200
          description: Immutable display label; omit/blank → permanently empty
        labelPublic:
          type: boolean
          default: false
          description: Show `label` on public verify; mutable via PATCH
        internalLabel:
          type: string
          description: Private name; never on certificates or public APIs

    RegistrationCreatedResponse:
      type: object
      required:
        - registrationId
        - hash
        - digests
        - submissionMode
        - registrantRole
        - label
        - labelPublic
        - tsaTimestamp
        - tsaProvider
        - certificateUrl
        - keepOriginalsNotice
      additionalProperties: false
      properties:
        registrationId:
          type: string
          format: uuid
          description: New registration id
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Primary proof digest (compat alias of the designated proof)
        digests:
          type: array
          minItems: 1
          description: Typed proof (and any discovery) digests
          items:
            $ref: '#/components/schemas/ContentDigest'
        fingerprintSetVersion:
          type: string
          description: |
            Entitled discovery-fingerprint producer set for this media type and plan
            (present when at least one producer was entitled). Images: all plans; video/audio: PRO+.
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Version commitment hex over proof digests only
        submissionMode:
          type: string
          enum: [server-computed, client-supplied]
        registrantRole:
          type: string
          enum: [creator, witness]
        label:
          type: string
          description: Immutable display label (may be empty)
        labelPublic:
          type: boolean
        internalLabel:
          type: string
          nullable: true
          description: Private name; present on authenticated create
        discoverability:
          type: string
          enum: [hidden, label_visible]
          description: Present when opted into similarity
        similarityIndexStatus:
          type: string
          enum: [pending, indexed, failed]
          description: "`pending` on opt-in create; omitted when not opted in"
        tsaTimestamp:
          type: string
          format: date-time
          description: TSA timestamp (UTC, ms)
        tsaProvider:
          type: string
          description: TSA provider that issued the token
        certificateUrl:
          type: string
          format: uri-reference
          description: Relative URL to download the certificate PDF
        keepOriginalsNotice:
          type: string
          minLength: 1
          description: Reminder to keep original files for future refresh / re-verify
        c2pa:
          $ref: '#/components/schemas/C2paMetadata'
        priorRegistrationNotice:
          $ref: '#/components/schemas/PriorRegistrationNotice'
    PriorRegistrationNotice:
      type: object
      description: |
        Present when other registrants already hold a matching proof digest.
        Never identifies those registrants.
      required:
        - earliestPriorTsaTimestamp
        - laterMatchCount
      additionalProperties: false
      properties:
        earliestPriorTsaTimestamp:
          type: string
          format: date-time
          description: Earliest other-registrant TSA timestamp among matches (UTC, ms)
        laterMatchCount:
          type: integer
          minimum: 0
          description: Additional other-registrant matches after the earliest
    C2paMetadata:
      type: object
      required:
        - c2paClaimGenerator
        - c2paSigningTime
        - c2paSignerDisplayName
        - c2paSignerTrusted
        - c2paHasIngredients
      additionalProperties: false
      properties:
        c2paClaimGenerator:
          type: string
        c2paSigningTime:
          type: string
          format: date-time
        c2paSignerDisplayName:
          type: string
        c2paSignerTrusted:
          type: boolean
        c2paDigitalSourceType:
          type: string
        c2paHasIngredients:
          type: boolean
        trustNotice:
          type: string
          description: Human-readable C2PA trust-list notice captured at registration
    DuplicateRegistrationResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorEnvelope'
        - type: object
          required:
            - existingRegistration
          properties:
            existingRegistration:
              $ref: '#/components/schemas/RegistrationSummary'
    RegistrationSummary:
      type: object
      required:
        - registrationId
        - hash
        - digests
        - submissionMode
        - tsaTimestamp
        - tsaProvider
        - certificateUrl
      description: |
        Existing registration returned on 409 duplicate. Includes `label` only when
        `labelPublic` and non-empty. Never includes `internalLabel`.
      properties:
        registrationId:
          type: string
          format: uuid
        hash:
          type: string
          description: Primary proof digest
        digests:
          type: array
          items:
            $ref: '#/components/schemas/ContentDigest'
        submissionMode:
          type: string
        registrantSnapshot:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
        tsaTimestamp:
          type: string
          format: date-time
        tsaProvider:
          type: string
        certificateUrl:
          type: string
        label:
          type: string
          description: Present only when `labelPublic` and non-empty
    FingerprintRefreshMultipartRequest:
      type: object
      required:
        - file
      description: |
        Same transport as create multipart (`file` + optional `mediaType`).
        Create-only fields are ignored if present.
      properties:
        file:
          type: string
          format: binary
          description: Original asset bytes
        mediaType:
          type: string
          description: Optional MIME; sniffed when omitted (same rules as create)
        similarityOptIn:
          type: boolean
          default: false
          description: |
            Opt an existing text registration into similarity. Binary with true → 400.
            Proof mismatch → 409 with no enqueue.
        discoverability:
          type: string
          enum: [hidden, label_visible]
          default: hidden
          description: Similarity visibility when opting in
    FingerprintRefreshJsonRequest:
      type: object
      required:
        - text
      description: |
        Same transport as create JSON text. Create-only fields are ignored if present.
      properties:
        text:
          type: string
          description: Original UTF-8 text (trimmed like create before hashing)
        mediaType:
          type: string
          description: Optional; must be `text/*` when present (defaults to `text/plain`)
        similarityOptIn:
          type: boolean
          default: false
          description: Opt an existing text registration into similarity
        discoverability:
          type: string
          enum: [hidden, label_visible]
          default: hidden
          description: Similarity visibility when opting in
    FingerprintRefreshCreatedResponse:
      type: object
      required:
        - fingerprintRefreshId
        - registrationId
        - linkKind
        - sequence
        - originalProofHash
        - digests
        - fingerprintSetVersion
        - tsaTimestamp
        - tsaProvider
        - createdAt
        - lineage
        - keepOriginalsNotice
      additionalProperties: false
      properties:
        fingerprintRefreshId:
          type: string
          description: Id of this refresh record
        registrationId:
          type: string
          description: Parent registration id
        linkKind:
          type: string
          enum: [fingerprint_refresh]
        sequence:
          type: integer
          minimum: 1
          description: 1-based position in the registration's refresh lineage
        originalProofHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Stored proof digest hex that overlapped the upload
        digests:
          type: array
          minItems: 0
          description: New `role=discovery` digests only (empty for pure-text tip)
          items:
            $ref: '#/components/schemas/ContentDigest'
        fingerprintSetVersion:
          type: string
          description: Producer set applied by this refresh (also written on the registration)
        previousFingerprintSetVersion:
          type: string
          description: Prior producer set version when one existed
        tsaTimestamp:
          type: string
          format: date-time
          description: Refresh-owned TSA timestamp (independent of the registration)
        tsaProvider:
          type: string
        createdAt:
          type: string
          format: date-time
        lineage:
          $ref: '#/components/schemas/FingerprintLineage'
        keepOriginalsNotice:
          type: string
          description: Reminder to keep original files
        discoverability:
          type: string
          enum: [hidden, label_visible]
          description: Echoed from the parent when similarity-opted
        similarityIndexStatus:
          type: string
          enum: [pending, indexed, failed]
          description: Similarity index state after opt-in / retry
    FingerprintLineage:
      type: object
      description: Refresh lineage and outdated-badge fields for portfolio UIs
      required: [refreshCount, outdated]
      additionalProperties: false
      properties:
        fingerprintSetVersion:
          type: string
          description: Current producer set version on the registration
        refreshCount:
          type: integer
          minimum: 0
          description: Number of committed refreshes
        latestFingerprintRefreshId:
          type: string
          description: Id of the most recent refresh
        latestRefreshedAt:
          type: string
          format: date-time
        outdated:
          type: boolean
          description: True when the plan entitles a newer/different producer set for this media type
