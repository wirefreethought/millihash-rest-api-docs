openapi: 3.1.0
info:
  title: MilliHash Public Verification API
  version: 1.0.0
  description: |
    Verify assets and certificates, check Bitcoin anchors, validate project chains,
    and fetch public stats or the sample proof. No authentication required.
servers:
  - url: https://free-api.millihash.io
    description: Free / public API
  - url: https://millihash.p.rapidapi.com
    description: Authenticated API
paths:
  /verify:
    post:
      operationId: verifyAsset
      summary: Verify an asset
      description: |
        Hash the upload with the same normalization as registration and look up exact proof matches.

        - **Multipart** — `contentType=binary` + `file`.
        - **JSON** — `contentType=text` + `text`.
        - Does not re-extract C2PA from the upload; echoes stored metadata only.
      tags:
        - Public Verification
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyBinaryMultipartRequest'
          application/vnd.millihash.v1+json:
            schema:
              $ref: '#/components/schemas/VerifyTextJsonRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyTextJsonRequest'
      responses:
        '200':
          description: Hit or explicit not-found
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/AssetVerificationResponse'
        '400':
          description: Invalid request
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Asset too large
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /certificates/{id}/verify:
    get:
      operationId: verifyCertificate
      summary: Verify a certificate
      description: |
        Look up by certificate UUID or 64-char SHA-256 hex (case-insensitive).
        Validates the TSA token and optional LTV chain. Does not return anchor state or PDF bytes.
        `shareableUrl` is always keyed by certificate id.
      tags:
        - Public Verification
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Certificate UUID or SHA-256 hex
      responses:
        '200':
          description: Hit or not-found
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/CertificateVerificationResponse'
        '400':
          description: Invalid hash format
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /anchors/{registrationId}:
    get:
      operationId: getAnchorStatus
      summary: Get Bitcoin anchor status
      description: |
        Look up by certificate UUID or SHA-256 hex. Returns the anchor job snapshot.
        Certificate validity is independent of anchor state (`certificateStillValid` is always true on a hit).
      tags:
        - Public Verification
      security: []
      parameters:
        - name: registrationId
          in: path
          required: true
          description: Certificate UUID or SHA-256 hex
          schema:
            type: string
      responses:
        '200':
          description: Anchor status or not-found
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/AnchorStatusResponse'
        '400':
          description: Invalid hash format
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /anchors/{registrationId}/ots:
    get:
      operationId: downloadAnchorOts
      summary: Download OpenTimestamps proof
      description: Returns raw `.ots` bytes when the anchor is Confirmed; otherwise 404.
      tags:
        - Public Verification
      security: []
      parameters:
        - name: registrationId
          in: path
          required: true
          description: Certificate UUID or SHA-256 hex
          schema:
            type: string
      responses:
        '200':
          description: OTS proof bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: No confirmed proof for this id
        '429':
          description: Rate limited
  /projects/{projectId}/chain/verify:
    get:
      operationId: verifyProjectChain
      summary: Verify a project chain
      description: |
        Checks sequential version numbers and `contentHash` links for a project.
        Public; no ownership required.
      tags:
        - Public Verification
      security: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Chain verification outcome
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ChainVerificationOutcome'
        '429':
          description: Rate limited
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /stats:
    get:
      operationId: getPublicStats
      summary: Get public activity stats
      description: |
        Aggregate service activity for public pages. Always includes `timestampStandard` and
        `anchoring`. Optional fields appear only when thresholds are met (never zero-padded).
        No hashes, labels, or registrant data. Cached up to 60 seconds.
      tags:
        - Public Verification
      security: []
      responses:
        '200':
          description: Public activity stats
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/PublicStatsResponse'
        '429':
          description: Rate limited
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /sample:
    get:
      operationId: getSampleProof
      summary: Get the sample proof
      description: |
        Returns a MilliHash-registered text sample so you can try `POST /verify`
        without your own content. Submit `text` unchanged with `contentType=text`.
      tags:
        - Public Verification
      security: []
      responses:
        '200':
          description: Sample proof
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/SampleProofResponse'
        '404':
          description: Sample not available on this deployment
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    VerifyBinaryMultipartRequest:
      type: object
      required: [contentType, file]
      properties:
        contentType:
          type: string
          enum: [binary]
          description: Must be `binary` for multipart verify
        file:
          type: string
          format: binary
          description: Raw bytes to hash and look up
    VerifyTextJsonRequest:
      type: object
      required: [contentType, text]
      properties:
        contentType:
          type: string
          enum: [text]
          description: Must be `text` for JSON verify
        text:
          type: string
          description: Text to normalize and hash (same pipeline as registration)
    PublicStatsResponse:
      type: object
      required: [timestampStandard, anchoring]
      properties:
        timestampStandard:
          type: string
          const: RFC 3161
          description: Timestamp standard used by MilliHash
        anchoring:
          type: string
          const: bitcoin-opentimestamps
          description: Anchoring mechanism
        latestAnchorConfirmedAt:
          type: string
          format: date-time
          description: Omitted when no Bitcoin anchor confirmed in the recent window (default 7 days)
        usage:
          type: object
          description: Present only when at least one field meets its threshold
          properties:
            registrations:
              type: integer
              format: int64
              description: Registration count when above threshold
            confirmedAnchors:
              type: integer
              format: int64
              description: Confirmed-anchor count when above threshold
            lastRegistrationAt:
              type: string
              format: date-time
              description: Omitted when the latest registration is older than the recent window (default 24h)
    SampleProofResponse:
      type: object
      required: [text, certificateId, registeredAt, anchorState]
      properties:
        text:
          type: string
          description: Exact registered text — submit unchanged to `POST /verify`
        certificateId:
          type: string
          description: Sample certificate id
        registeredAt:
          type: string
          format: date-time
        anchorState:
          type: string
          enum: [Pending, Stamped, Confirmed, Failed]
    RegistrantSnapshot:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          description: Registrant display name at registration time
        email:
          type: string
          format: email
          description: Registrant email at registration time
    C2paMetadata:
      type: object
      required:
        - c2paClaimGenerator
        - c2paSignerTrusted
        - trustNotice
      properties:
        c2paClaimGenerator:
          type: string
        c2paSigningTime:
          type: string
          format: date-time
        c2paSignerDisplayName:
          type: string
        c2paSignerTrusted:
          type: boolean
        c2paDigitalSourceType:
          type: string
        c2paHasIngredients:
          type: boolean
        trustNotice:
          type: string
          description: Human-readable C2PA trust-list notice
    AssetVerificationResponse:
      oneOf:
        - $ref: '#/components/schemas/AssetVerificationHit'
        - $ref: '#/components/schemas/VerificationNotFound'
    LaterMatchSummary:
      type: object
      description: Later multi-match row (not the earliest lead). No registrant PII; no certificate id.
      required: [registrationId, tsaTimestamp]
      properties:
        registrationId:
          type: string
        tsaTimestamp:
          type: string
          description: UTC ISO-8601 with millisecond precision
        label:
          type: string
          description: Present only when `labelPublic` and label is non-empty
    AssetVerificationHit:
      type: object
      required:
        - hash
        - digests
        - hitType
        - registrantSnapshot
        - tsaTimestamp
        - tsaProvider
        - submissionMode
        - certificateVerificationUrl
        - semanticsNotice
      properties:
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Primary proof digest of the matched (lead) registration
        digests:
          type: array
          description: Typed digests on the lead registration
          items:
            type: object
            required: [role, algorithm, transform, digestHex]
            properties:
              role:
                type: string
              algorithm:
                type: string
              transform:
                type: string
              digestHex:
                type: string
        matchedAlgorithm:
          type: string
          description: Algorithm of the proof digest that matched the upload
        matchedTransform:
          type: string
          description: Transform of the proof digest that matched the upload
        matchedClass:
          type: string
          const: proof
          description: Always `proof` on this endpoint
        registrantRole:
          type: string
          description: Lead registration `registrantRole`
        label:
          type: string
          description: Present only when `labelPublic` and label is non-empty
        hitType:
          type: string
          enum: [standalone, chain_version]
        projectId:
          type: string
          format: uuid
          description: Present when `hitType` is `chain_version`
        versionNumber:
          type: integer
          description: Present when `hitType` is `chain_version`
        chainVerifyUrl:
          type: string
          description: Public chain-verify URL when `hitType` is `chain_version`
        registrantSnapshot:
          $ref: '#/components/schemas/RegistrantSnapshot'
        tsaTimestamp:
          type: string
          description: UTC ISO-8601 with millisecond precision
        tsaProvider:
          type: string
        submissionMode:
          type: string
          enum: [server-computed, client-supplied]
        submissionModeNotice:
          type: string
          description: Present only when `submissionMode` is `client-supplied`
        semanticsNotice:
          type: string
          description: Fixed existence-only semantics notice
        certificateVerificationUrl:
          type: string
          format: uri
        additionalMatchCount:
          type: integer
          minimum: 0
          description: Later registrations sharing the proof digest; omit or 0 when sole match
        additionalMatches:
          type: array
          items:
            $ref: '#/components/schemas/LaterMatchSummary'
          description: Present when `additionalMatchCount` > 0
        c2pa:
          $ref: '#/components/schemas/C2paMetadata'
    CertificateVerificationResponse:
      oneOf:
        - $ref: '#/components/schemas/CertificateVerificationHit'
        - $ref: '#/components/schemas/VerificationNotFound'
    CertificateVerificationHit:
      type: object
      required:
        - certificateId
        - hash
        - digests
        - registrantSnapshot
        - tsaTimestamp
        - tsaProvider
        - submissionMode
        - shareableUrl
        - tsaValidation
        - semanticsNotice
      properties:
        certificateId:
          type: string
          format: uuid
        hash:
          type: string
          description: Primary proof digest
        digests:
          type: array
          items:
            type: object
            required: [role, algorithm, transform, digestHex]
            properties:
              role:
                type: string
              algorithm:
                type: string
              transform:
                type: string
              digestHex:
                type: string
        label:
          type: string
          description: Present only when `labelPublic` and label is non-empty
        registrantRole:
          type: string
        matchedAlgorithm:
          type: string
          description: Present when lookup was by digest (hash path)
        matchedTransform:
          type: string
          description: Present when lookup was by digest (hash path)
        matchedClass:
          type: string
          const: proof
        registrantSnapshot:
          $ref: '#/components/schemas/RegistrantSnapshot'
        tsaTimestamp:
          type: string
        tsaProvider:
          type: string
        submissionMode:
          type: string
          enum: [server-computed, client-supplied]
        submissionModeNotice:
          type: string
        shareableUrl:
          type: string
          format: uri
          description: Always keyed by certificate id
        tsaValidation:
          $ref: '#/components/schemas/TsaValidationOutcome'
        ltvChain:
          type: array
          items:
            $ref: '#/components/schemas/LtvChainLink'
        c2pa:
          $ref: '#/components/schemas/C2paMetadata'
        semanticsNotice:
          type: string
        additionalMatchCount:
          type: integer
          minimum: 0
          description: Hash path only — later proof-digest matches; omit on certificate-id path
        additionalMatches:
          type: array
          items:
            $ref: '#/components/schemas/LaterMatchSummary'
          description: Hash path only when `additionalMatchCount` > 0
    TsaValidationOutcome:
      type: object
      required:
        - signatureValid
        - chainValidatedTo
        - timeOfStampWithinSigningCertValidity
        - revocationChecked
      properties:
        signatureValid:
          type: boolean
          description: Whether the TSA signature validates
        chainValidatedTo:
          type: string
          description: Trust anchor the chain validated to
        timeOfStampWithinSigningCertValidity:
          type: boolean
        revocationChecked:
          type: boolean
          default: false
    LtvChainLink:
      type: object
      required: [provider, signedAt, validationOutcome]
      properties:
        provider:
          type: string
        signedAt:
          type: string
          format: date-time
        validationOutcome:
          type: string
          enum: [valid, invalid]
    AnchorStatusResponse:
      oneOf:
        - $ref: '#/components/schemas/AnchorStatusHit'
        - $ref: '#/components/schemas/VerificationNotFound'
    AnchorStatusHit:
      type: object
      required: [state, shareableUrl, certificateStillValid]
      properties:
        state:
          type: string
          enum: [Pending, Stamped, Confirmed, Failed]
          description: Anchor job state
        shareableUrl:
          type: string
          format: uri
        certificateStillValid:
          type: boolean
          const: true
          description: Always true on a hit — TSA validity is independent of Bitcoin confirmation
        otsBase64:
          type: string
          description: Base64 OpenTimestamps proof when available
        otsDownloadUrl:
          type: string
          format: uri
          description: URL to download raw `.ots` bytes when Confirmed
        bitcoinBlockConfirmationTime:
          type: string
          format: date-time
        bitcoinBlockConfirmationTimeNote:
          type: string
        estimatedConfirmationWindow:
          type: string
        failureReason:
          type: string
        attemptsExhausted:
          type: boolean
        totalAttempts:
          type: integer
          const: 4
    VerificationNotFound:
      type: object
      required: [result, message]
      properties:
        result:
          type: string
          const: not_found
        message:
          type: string
    ChainVerificationOutcome:
      type: object
      required: [projectId, status, versions]
      properties:
        projectId:
          type: string
          format: uuid
        status:
          type: string
          enum: [valid, invalid, not_found]
          description: Overall chain integrity result
        label:
          type: string
          nullable: true
        versionCount:
          type: integer
          nullable: true
        message:
          type: string
          nullable: true
        versions:
          type: array
          description: Per-version chain summary (empty when not found)
          items:
            $ref: '#/components/schemas/ChainVersionSummary'
    ChainVersionSummary:
      type: object
      required:
        - versionNumber
        - registrationId
        - documentHash
        - contentHash
        - certificateId
        - tsaTimestamp
      properties:
        versionNumber:
          type: integer
        registrationId:
          type: string
          format: uuid
        documentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Primary proof digest
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Version commitment
        prevContentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
          description: Prior version commitment; null on genesis
        certificateId:
          type: string
          format: uuid
        tsaTimestamp:
          type: string
          format: date-time
    ErrorEnvelope:
      $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
