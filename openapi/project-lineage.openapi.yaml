openapi: 3.1.0
info:
  title: MilliHash Project Lineage API
  version: 1.0.0
  description: |
    Create projects and append versions. Request bodies reuse registration create shapes
    (see `registrations.openapi.yaml`).
servers:
  - url: https://millihash.p.rapidapi.com
    description: Authenticated API
paths:
  /projects:
    post:
      operationId: createProject
      summary: Create a project (genesis version)
      description: |
        Creates a project and version 1 registration from the same JSON/multipart shapes as
        `POST /registrations`. Consumes one registration quota unit.
      tags:
        - Project Lineage
      security:
        - RapidApiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: 'registrations.openapi.yaml#/components/schemas/ServerComputedMultipartRequest'
          application/vnd.millihash.v1+json:
            schema:
              oneOf:
                - $ref: 'registrations.openapi.yaml#/components/schemas/ServerComputedJsonRequest'
                - $ref: 'registrations.openapi.yaml#/components/schemas/ClientSuppliedJsonRequest'
      responses:
        '201':
          description: Project created with genesis version
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ProjectCreatedResponse'
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
        '409':
          description: Document hash already claimed (standalone or chain)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
        '413':
          description: Asset exceeds plan limits
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
        '502':
          description: TSA providers exhausted
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
  /projects/{projectId}/versions:
    post:
      operationId: appendProjectVersion
      summary: Append a project version
      description: |
        Adds version N+1 with a chained `contentHash`. Send `X-Project-Head-Content-Hash`
        equal to the current head commitment or the request fails with a head conflict (409).
      tags:
        - Project Lineage
      security:
        - RapidApiKey: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project to append to (must be yours)
          schema:
            type: string
            format: uuid
        - name: X-Project-Head-Content-Hash
          in: header
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
          description: Current head `contentHash` (optimistic concurrency / CAS)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: 'registrations.openapi.yaml#/components/schemas/ServerComputedMultipartRequest'
          application/vnd.millihash.v1+json:
            schema:
              $ref: 'registrations.openapi.yaml#/components/schemas/ServerComputedJsonRequest'
      responses:
        '201':
          description: Version appended
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/VersionAppendedResponse'
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
        '403':
          description: Not project registrant
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
        '404':
          description: Project not found
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
        '409':
          description: Head conflict, VERSION_UNCHANGED, or document hash claim rejected
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    RapidApiKey:
      $ref: 'common.openapi.yaml#/components/securitySchemes/RapidApiKey'
  schemas:
    ProjectCreatedResponse:
      type: object
      required:
        - projectId
        - registrationId
        - versionNumber
        - documentHash
        - digests
        - contentHash
        - certificateUrl
        - chainVerifyUrl
      properties:
        projectId:
          type: string
          format: uuid
          description: New project id
        label:
          type: string
          nullable: true
          description: Immutable display label from create
        labelPublic:
          type: boolean
        internalLabel:
          type: string
          nullable: true
          description: Private name
        registrationId:
          type: string
          format: uuid
          description: Genesis version registration id
        versionNumber:
          type: integer
          const: 1
          description: Always 1 for genesis
        documentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Primary proof digest
        digests:
          type: array
          description: Typed digests for the genesis version
          items:
            $ref: 'registrations.openapi.yaml#/components/schemas/ContentDigest'
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Version commitment over proof digests (use as CAS header when appending)
        certificateUrl:
          type: string
          description: Relative URL to the genesis certificate PDF
        chainVerifyUrl:
          type: string
          description: Public chain-verify path
          example: /projects/{projectId}/chain/verify
    VersionAppendedResponse:
      type: object
      required:
        - projectId
        - registrationId
        - versionNumber
        - documentHash
        - digests
        - contentHash
        - headContentHash
        - certificateUrl
      properties:
        projectId:
          type: string
          format: uuid
        registrationId:
          type: string
          format: uuid
          description: New version registration id
        versionNumber:
          type: integer
          minimum: 2
          description: Appended version number (N+1)
        documentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Primary proof digest for this version
        digests:
          type: array
          items:
            $ref: 'registrations.openapi.yaml#/components/schemas/ContentDigest'
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Chained version commitment (`SHA-256(commitmentBytes ‖ prevContentHash)`)
        headContentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: New head commitment after append (same as `contentHash`)
        certificateUrl:
          type: string
          description: Relative URL to this version's certificate PDF
