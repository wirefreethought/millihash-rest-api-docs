openapi: 3.1.0
info:
  title: MilliHash Registrant Portfolio API
  version: 1.0.0
  description: |
    List and manage your registrations and projects, and download certificate PDFs.
servers:
  - url: https://millihash.p.rapidapi.com
    description: Authenticated API
paths:
  /projects:
    get:
      operationId: listRegistrantProjects
      summary: List your projects
      description: |
        Cursor-paginated list of projects you own (page size 50).
        Ordered by `createdAt` descending, then `projectId` ascending.
      tags:
        - Registrant Portfolio
      security:
        - RapidApiKey: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a prior `nextPageCursor`. Omit for the first page.
          schema:
            type: string
      responses:
        '200':
          description: Project list page
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ProjectListPage'
        '400':
          description: Invalid cursor
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /projects/{projectId}:
    get:
      operationId: getRegistrantProject
      summary: Get project detail
      description: Returns a project you own, including an ordered version timeline.
      tags:
        - Registrant Portfolio
      security:
        - RapidApiKey: []
      parameters:
        - name: projectId
          in: path
          required: true
          description: Project id (must be yours)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project detail
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not the project registrant
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Project not found
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /registrations:
    get:
      operationId: listRegistrantRegistrations
      summary: List your registrations
      description: |
        Cursor-paginated registry of registrations you own (page size 50).
        Default sort: `tsaTimestamp` descending. Optional `sort` / `direction`;
        tie-break is always `registrationId` ascending.
        Rows include digests, labels, display name, and anchor state (no per-row anchor lookup).
      tags:
        - Registrant Portfolio
      security:
        - RapidApiKey: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from a prior `nextPageCursor`. Omit for the first page.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: |
            Primary sort field. `label` uses display-name order (`internalLabel`, then `label`).
            Default `tsaTimestamp`.
          schema:
            type: string
            enum: [tsaTimestamp, label, bitcoinBlockConfirmationTime]
            default: tsaTimestamp
        - name: direction
          in: query
          required: false
          description: |
            Sort direction. Defaults: `tsaTimestamp` / `bitcoinBlockConfirmationTime` → `desc`;
            `label` → `asc`.
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Registry page
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/RegistryListingResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryListingResponse'
        '400':
          description: Invalid cursor, sort, or direction
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /registrations/{registrationId}:
    patch:
      operationId: patchRegistrationLabels
      summary: Update registration labels
      description: |
        Patch any subset of `labelPublic`, `internalLabel`, and `discoverability`.
        Immutable `label` and proof digests are rejected.
        `labelPublic=true` with an empty label → 400.
        `discoverability` requires similarity opt-in → else 400 `SIMILARITY_NOT_OPTED_IN`.
      tags:
        - Registrant Portfolio
      security:
        - RapidApiKey: []
      parameters:
        - name: registrationId
          in: path
          required: true
          description: Registration to update (must be yours)
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/vnd.millihash.v1+json:
            schema:
              $ref: '#/components/schemas/RegistrationLabelPatchRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationLabelPatchRequest'
      responses:
        '200':
          description: Updated label metadata
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/RegistrationLabelPatchResponse'
        '400':
          description: Invalid patch (empty public label, unknown fields, not opted in, or internal label too large)
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not the asset registrant
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Registration not found
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /certificates/{certificateId}:
    get:
      operationId: downloadCertificate
      summary: Download certificate PDF
      description: |
        Renders the certificate PDF on demand for a registration you own.
        Same renderer version → byte-identical PDFs on repeat download.
      tags:
        - Registrant Portfolio
      security:
        - RapidApiKey: []
      parameters:
        - name: certificateId
          in: path
          required: true
          description: Certificate UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Certificate PDF
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Label-based filename when present; otherwise certificateId.
              examples:
                labelBased:
                  value: attachment; filename="millihash-my-asset.pdf"
                idFallback:
                  value: attachment; filename="millihash-certificate-6d0915e7-4f86-4f99-987e-57f8f83e8354.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not the asset registrant
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Certificate not found
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /certificates/{certificateId}/anchored:
    get:
      operationId: downloadAnchoredCertificate
      summary: Download anchored certificate PDF
      description: |
        Renders the Layer-1 + Bitcoin-anchored certificate PDF when the anchor is Confirmed.
        Pending / Stamped / Failed → 409 `ANCHOR_NOT_CONFIRMED`.
      tags:
        - Registrant Portfolio
      security:
        - RapidApiKey: []
      parameters:
        - name: certificateId
          in: path
          required: true
          description: Certificate UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Anchored certificate PDF
          headers:
            Content-Disposition:
              schema:
                type: string
              examples:
                labelBased:
                  value: attachment; filename="millihash-anchored-my-asset.pdf"
                idFallback:
                  value: attachment; filename="millihash-anchored-certificate-6d0915e7-4f86-4f99-987e-57f8f83e8354.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          description: Authentication required
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Not the asset registrant
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Certificate not found
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Anchor not Confirmed
          content:
            application/vnd.millihash.v1+json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    RapidApiKey:
      $ref: 'common.openapi.yaml#/components/securitySchemes/RapidApiKey'
  schemas:
    ErrorEnvelope:
      $ref: 'common.openapi.yaml#/components/schemas/ErrorEnvelope'
    RegistrantKey:
      type: object
      required: [identityProvider, userId]
      properties:
        identityProvider:
          type: string
          description: Identity provider id
          example: rapidapi
        userId:
          type: string
          description: Stable user id within the provider
          example: usr_alice
    RegistryListingResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          description: Registrations on this page
          items:
            $ref: '#/components/schemas/RegistryListingRow'
        nextPageCursor:
          type: string
          nullable: true
          description: Cursor for the next page; null when done
    RegistryListingRow:
      type: object
      required:
        - registrationId
        - registrantKey
        - label
        - labelPublic
        - displayName
        - hashTruncated
        - digests
        - submissionMode
        - tsaTimestamp
        - tsaProvider
        - certificateUrl
        - anchorConfirmationUrl
        - anchorState
      properties:
        registrationId:
          type: string
          format: uuid
          description: Registration id
        registrantKey:
          $ref: '#/components/schemas/RegistrantKey'
        label:
          type: string
          nullable: true
          description: Immutable public/display label set at create
        labelPublic:
          type: boolean
          description: Whether `label` is shown on public verify responses
        internalLabel:
          type: string
          description: Private name; never on certificates or public APIs
        displayName:
          type: string
          description: "`internalLabel` if set, otherwise `label`"
        hashTruncated:
          type: string
          description: Truncated primary proof digest (first 8 … last 8 hex)
          example: d41d8cd9…098f00bc
        digests:
          type: array
          description: Typed proof and discovery digests
          items:
            type: object
            required: [role, algorithm, transform, digestHex]
            properties:
              role:
                type: string
              algorithm:
                type: string
              transform:
                type: string
              digestHex:
                type: string
        submissionMode:
          type: string
          enum: [server-computed, client-supplied]
          description: How the registration was created
        tsaTimestamp:
          type: string
          format: date-time
          description: TSA timestamp (UTC, ms)
        tsaProvider:
          type: string
          description: TSA provider that issued the token
        certificateUrl:
          type: string
          description: Relative URL to download the certificate PDF
          example: /certificates/6d0915e7-4f86-4f99-987e-57f8f83e8354
        anchorConfirmationUrl:
          type: string
          format: uri
          description: Public page for Bitcoin anchor status
          example: https://app.millihash.com/anchor/6d0915e7-4f86-4f99-987e-57f8f83e8354
        anchorState:
          type: string
          enum: [Pending, Stamped, Confirmed, Failed]
          description: Current Bitcoin anchor job state
        anchoredCertificateUrl:
          type: string
          description: Present when `anchorState` is Confirmed
          example: /certificates/6d0915e7-4f86-4f99-987e-57f8f83e8354/anchored
        bitcoinBlockConfirmationTime:
          type: string
          format: date-time
          description: Informational Bitcoin corroboration time when available
          example: 2026-02-01T00:00:00.000Z
        fingerprintSetVersion:
          type: string
          description: Discovery fingerprint producer set version when applicable
          nullable: true
        outdatedFingerprint:
          type: boolean
          description: True when a newer producer set is available for this media type / plan
          enum: [true]
        projectId:
          type: string
          format: uuid
          description: Present when this registration is a project chain version
          nullable: true
        discoverability:
          type: string
          enum: [hidden, label_visible]
          description: Similarity visibility; present only when opted in
          nullable: true
        similarityIndexStatus:
          type: string
          enum: [pending, indexed, failed]
          description: Similarity index state; present only when opted in
          nullable: true
        c2pa:
          $ref: '#/components/schemas/C2paListingMetadata'
    RegistrationLabelPatchRequest:
      type: object
      additionalProperties: false
      description: Any subset of mutable label fields
      properties:
        labelPublic:
          type: boolean
          description: Show `label` on public verify responses (requires non-empty label)
        internalLabel:
          type: string
          nullable: true
          description: Private name; size limited by plan `maxInternalLabelLength`
        discoverability:
          type: string
          enum: [hidden, label_visible]
          description: Similarity result visibility; requires similarity opt-in
    RegistrationLabelPatchResponse:
      type: object
      required: [registrationId, label, labelPublic]
      properties:
        registrationId:
          type: string
          format: uuid
        label:
          type: string
          description: Immutable label (unchanged by this patch)
        labelPublic:
          type: boolean
        internalLabel:
          type: string
          nullable: true
        discoverability:
          type: string
          enum: [hidden, label_visible]
          description: Echoed when similarity-opted; omitted otherwise
          nullable: true
    C2paListingMetadata:
      type: object
      required:
        - c2paClaimGenerator
        - c2paSigningTime
        - c2paSignerDisplayName
        - c2paSignerTrusted
        - c2paHasIngredients
        - trustNotice
      properties:
        c2paClaimGenerator:
          type: string
        c2paSigningTime:
          type: string
        c2paSignerDisplayName:
          type: string
        c2paSignerTrusted:
          type: boolean
        c2paDigitalSourceType:
          type: string
        c2paHasIngredients:
          type: boolean
        trustNotice:
          type: string
          description: Human-readable C2PA trust-list notice captured at registration
    ProjectListPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          description: Projects on this page
          items:
            $ref: '#/components/schemas/ProjectSummary'
        nextPageCursor:
          type: string
          nullable: true
          description: Cursor for the next page; null when done
    ProjectSummary:
      type: object
      required:
        - projectId
        - headVersionNumber
        - headRegistrationId
        - headContentHash
        - versionCount
        - createdAt
      properties:
        projectId:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
          description: Project display label when set
        headVersionNumber:
          type: integer
          description: Current head version number
        headRegistrationId:
          type: string
          format: uuid
          description: Registration id of the head version
        headContentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Head version commitment (use as CAS header when appending)
        versionCount:
          type: integer
        createdAt:
          type: string
          format: date-time
    ProjectDetail:
      type: object
      required: [project, versions]
      properties:
        project:
          $ref: '#/components/schemas/ProjectSummary'
        versions:
          type: array
          description: Ordered version timeline
          items:
            $ref: '#/components/schemas/ProjectVersionSummary'
    ProjectVersionSummary:
      type: object
      required:
        - registrationId
        - certificateId
        - versionNumber
        - documentHash
        - contentHash
        - tsaTimestamp
      properties:
        registrationId:
          type: string
          format: uuid
        certificateId:
          type: string
          format: uuid
        versionNumber:
          type: integer
        documentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Primary proof digest for this version
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Version commitment hex
        prevContentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          nullable: true
          description: Prior version commitment; null on genesis
        tsaTimestamp:
          type: string
          format: date-time
