openapi: 3.1.0

info:
  title: MilliHash API
  version: v1.0.0
  description: |
    MilliHash REST API for asset registration, verification, project lineage,
    portfolio management, and opt-in similarity search.

    **Hosts**

    - `https://free-api.millihash.io` — public verification, stats, and sample proof
    - `https://millihash.p.rapidapi.com` — authenticated registration, portfolio, projects,
      similarity, plan, plus the same public verification routes
    - `https://app.millihash.com` — operator admin audit (Auth0 JWT)

    Authenticated routes require `X-RapidAPI-Key`. Public verification routes require no auth.
  x-logo:
    url: logo.png
    backgroundColor: "#FFFFFF"

servers:
  - url: https://free-api.millihash.io
    description: Free / public API
  - url: https://millihash.p.rapidapi.com
    description: Authenticated API
  - url: https://app.millihash.com
    description: Operator admin console

tags:
  - name: Admin Audit
    description: Operator audit search (Auth0 JWT)
  - name: Registrations
    description: Register assets and refresh discovery fingerprints
  - name: Project Lineage
    description: Create projects and append versions
  - name: Registrant Portfolio
    description: List registrations/projects and download certificates
  - name: Public Verification
    description: Verify assets, certificates, anchors, chains; public stats and sample
  - name: Similarity Search
    description: Opt-in semantic text similarity search and samples
  - name: Plan
    description: Current plan and upload / query ceilings

paths:
  /registrations:
    get:
      $ref: 'openapi/registrant-portfolio.openapi.yaml#/paths/~1registrations/get'
    post:
      $ref: 'openapi/registrations.openapi.yaml#/paths/~1registrations/post'
  /registrations/{registrationId}:
    patch:
      $ref: 'openapi/registrant-portfolio.openapi.yaml#/paths/~1registrations~1{registrationId}/patch'
  /registrations/{registrationId}/fingerprint-refreshes:
    post:
      $ref: 'openapi/registrations.openapi.yaml#/paths/~1registrations~1{registrationId}~1fingerprint-refreshes/post'
  /certificates/{certificateId}:
    $ref: 'openapi/registrant-portfolio.openapi.yaml#/paths/~1certificates~1{certificateId}'
  /certificates/{certificateId}/anchored:
    $ref: 'openapi/registrant-portfolio.openapi.yaml#/paths/~1certificates~1{certificateId}~1anchored'
  /projects:
    get:
      $ref: 'openapi/registrant-portfolio.openapi.yaml#/paths/~1projects/get'
    post:
      $ref: 'openapi/project-lineage.openapi.yaml#/paths/~1projects/post'
  /projects/{projectId}:
    get:
      $ref: 'openapi/registrant-portfolio.openapi.yaml#/paths/~1projects~1{projectId}/get'
  /projects/{projectId}/versions:
    post:
      $ref: 'openapi/project-lineage.openapi.yaml#/paths/~1projects~1{projectId}~1versions/post'
  /projects/{projectId}/chain/verify:
    get:
      $ref: 'openapi/public-verification.openapi.yaml#/paths/~1projects~1{projectId}~1chain~1verify/get'
  /verify:
    $ref: 'openapi/public-verification.openapi.yaml#/paths/~1verify'
  /certificates/{id}/verify:
    $ref: 'openapi/public-verification.openapi.yaml#/paths/~1certificates~1{id}~1verify'
  /anchors/{registrationId}:
    $ref: 'openapi/public-verification.openapi.yaml#/paths/~1anchors~1{registrationId}'
  /anchors/{registrationId}/ots:
    $ref: 'openapi/public-verification.openapi.yaml#/paths/~1anchors~1{registrationId}~1ots'
  /stats:
    $ref: 'openapi/public-verification.openapi.yaml#/paths/~1stats'
  /sample:
    $ref: 'openapi/public-verification.openapi.yaml#/paths/~1sample'
  /me/plan:
    $ref: 'openapi/me-plan.openapi.yaml#/paths/~1me~1plan'
  /admin/audit:
    $ref: 'openapi/audit-operations.openapi.yaml#/paths/~1admin~1audit'
  /similarity/searches:
    $ref: 'openapi/similarity-search.openapi.yaml#/paths/~1similarity~1searches'
  /samples/similarity:
    $ref: 'openapi/similarity-search.openapi.yaml#/paths/~1samples~1similarity'
  /registrations/{registrationId}/similarity-overlap:
    $ref: 'openapi/similarity-search.openapi.yaml#/paths/~1registrations~1{registrationId}~1similarity-overlap'

